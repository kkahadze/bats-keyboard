name: Release keyboard
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, plistlib
          from pathlib import Path
          info = plistlib.loads(Path('Bats.bundle/Contents/Info.plist').read_bytes())
          expected = 'v' + info['CFBundleShortVersionString']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Tag must match bundle version: {expected}')
          PY
      - run: python scripts/build.py --check --package
      - run: python -m unittest discover -s tests -v
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Bats $RELEASE_TAG" --notes-file CHANGELOG.md
