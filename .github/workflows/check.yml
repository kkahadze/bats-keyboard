name: Check keyboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check --package
      - run: python -m unittest discover -s tests -v
      - name: Validate Apple property lists
        if: runner.os == 'macOS'
        run: plutil -lint Bats.bundle/Contents/Info.plist Bats.bundle/Contents/version.plist Bats.bundle/Contents/Resources/en.lproj/InfoPlist.strings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bats-${{ runner.os }}
          path: dist/
