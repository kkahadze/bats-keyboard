name: Check keyboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check --package
      - run: python -m unittest discover -s tests -v
      - name: Validate Apple property lists
        if: runner.os == 'macOS'
        run: plutil -lint Bats.bundle/Contents/Info.plist Bats.bundle/Contents/version.plist Bats.bundle/Contents/Resources/en.lproj/InfoPlist.strings
      - uses: actions/upload-artifact@v4
        with:
          name: Bats-${{ runner.os }}
          path: dist/
